<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0e1016"/>
  <!-- ascending stepping-stone path — each step dimmer than the one ahead of it,
       the brightest dot is always the next step, not the destination -->
  <path d="M120 400 Q 220 340 200 260 Q 180 180 300 150 Q 380 130 392 96"
        fill="none" stroke="#2a2f40" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26"/>
  <circle cx="120" cy="400" r="14" fill="#4fd1c5" opacity="0.28"/>
  <circle cx="176" cy="330" r="15" fill="#4fd1c5" opacity="0.45"/>
  <circle cx="212" cy="252" r="16" fill="#4fd1c5" opacity="0.65"/>
  <circle cx="272" cy="176" r="17" fill="#4fd1c5" opacity="0.85"/>
  <circle cx="356" cy="118" r="22" fill="#4fd1c5"/>
  <circle cx="356" cy="118" r="34" fill="none" stroke="#4fd1c5" stroke-width="4" opacity="0.4"/>
</svg>
