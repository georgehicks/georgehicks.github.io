<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12141C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Treasuring</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    --bg:#12141C; --surface:#1B1F2B; --surface-2:#232938; --border:#2D3446;
    --ink:#ECE8DF; --ink-muted:#98A0B2; --ink-faint:#566079;
    --gold:#F2C879; --gold-glow:rgba(242,200,121,0.38); --heart:#E9788A; --heart-glow:rgba(233,120,138,0.4);
    --cloud:#3A4258; --cloud-open:#5A6684;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#F5F0E6; --surface:#FFFFFF; --surface-2:#EDE6D8; --border:#DDD3BE;
      --ink:#2A251C; --ink-muted:#7A705C; --ink-faint:#B5AA92;
      --gold:#B9801A; --gold-glow:rgba(201,143,30,0.3); --heart:#D4506A; --heart-glow:rgba(212,80,106,0.3);
      --cloud:#D3D9E6; --cloud-open:#AEB9D2; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg:#F5F0E6; --surface:#FFFFFF; --surface-2:#EDE6D8; --border:#DDD3BE;
    --ink:#2A251C; --ink-muted:#7A705C; --ink-faint:#B5AA92;
    --gold:#B9801A; --gold-glow:rgba(201,143,30,0.3); --heart:#D4506A; --heart-glow:rgba(212,80,106,0.3);
    --cloud:#D3D9E6; --cloud-open:#AEB9D2; color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-user-select:none; user-select:none; }
  button { font-family:inherit; cursor:pointer; color:inherit; -webkit-touch-callout:none; }
  input { font-family:inherit; -webkit-user-select:text; user-select:text; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  [hidden] { display:none !important; }

  .page { position:fixed; top:0; left:0; right:0; height:100vh; display:flex; flex-direction:column;
    padding:calc(0.7rem + env(safe-area-inset-top,0px)) 0.8rem 0; }
  @supports (height:100dvh) { .page { height:100dvh; } }
  .topbar { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; height:2.4rem; }
  .wordmark { font-family:var(--font-display); font-size:1.1rem; letter-spacing:.03em; color:var(--ink-muted); }
  .topbar-actions { display:flex; gap:.5rem; }
  .icon-btn { width:2.3rem; height:2.3rem; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--ink-muted); }
  .icon-btn:hover { color:var(--ink); }
  .icon-btn svg { width:1.15rem; height:1.15rem; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- stage ---------- */
  .stage { position:relative; flex:1; min-height:0; margin-top:.4rem; border-radius:22px 22px 0 0; overflow:hidden; touch-action:none;
    background:radial-gradient(ellipse at 50% 70%, color-mix(in srgb, var(--gold) 9%, var(--surface)) 0%, var(--bg) 75%); }
  .stage > * { position:absolute; left:0; top:0; }

  .cloud { width:min(86%,340px); height:96px; opacity:.28; transform-origin:50% 50%;
    transition:opacity 1s ease, filter 1s ease; filter:saturate(.3); pointer-events:none; }
  .cloud svg { width:100%; height:100%; overflow:visible; }
  .cloud .puff { fill:var(--cloud); transition:fill 1s ease; }
  .st-open .cloud { opacity:1; filter:none; }
  .st-open .cloud .puff { fill:var(--cloud-open); }
  .cloud .glow { fill:var(--gold); opacity:0; transition:opacity 1.2s ease; filter:blur(14px); }
  .st-open .cloud .glow { opacity:.28; }

  .christ { width:calc(var(--r)*2); height:calc(var(--r)*2); pointer-events:none; }
  .christ .halo { position:absolute; inset:-55%; border-radius:50%;
    background:radial-gradient(circle, var(--gold-glow) 0%, transparent 62%); opacity:.55; transition:opacity .9s ease, transform .9s ease; }
  .christ .disc { position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--gold) 80%, #fff) 0%, var(--gold) 55%, color-mix(in srgb, var(--gold) 55%, transparent) 100%);
    box-shadow:0 0 40px var(--gold-glow); opacity:.9; }
  .christ svg { position:absolute; inset:0; width:100%; height:100%; }
  .christ .cross { stroke:var(--bg); stroke-width:4.5; stroke-linecap:round; opacity:.55; }
  .christ .name { position:absolute; left:0; right:0; top:calc(100% + .35rem); text-align:center; font-family:var(--font-display); font-size:.9rem; letter-spacing:.06em; color:var(--ink-muted); }
  .st-with .christ .halo { opacity:1; transform:scale(1.12); animation:breathe 7s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:scale(1.22); opacity:.8; } }

  .heart { width:68px; height:68px; padding:0; border:none; background:none; touch-action:none; z-index:5; cursor:grab; }
  .heart.glide { transition:transform .75s cubic-bezier(.2,.75,.25,1); }
  .heart svg { width:100%; height:100%; overflow:visible; }
  .heart .shape { fill:var(--heart); transition:fill .8s ease; filter:drop-shadow(0 0 14px var(--heart-glow)); }
  .heart.apart .shape { fill:none; stroke:var(--heart); stroke-width:2.6; stroke-dasharray:5 5; opacity:.85; filter:none; }
  .heart.apart { animation:nudge 3.2s ease-in-out infinite; }
  .heart.dragging { cursor:grabbing; animation:none; }
  .heart.near .shape { filter:drop-shadow(0 0 22px var(--gold)); }
  @keyframes nudge { 50% { margin-top:8px; } }
  .st-with .heart { animation:none; }
  .st-with .heart svg { animation:beat 5s ease-in-out infinite; }
  @keyframes beat { 50% { transform:scale(1.07); } }

  .heartline { left:0; right:0; text-align:center; padding:0 1rem; pointer-events:none; transition:opacity .5s ease; }
  .heartline .l1 { font-family:var(--font-display); font-style:italic; font-size:1.12rem; color:var(--ink); }
  .heartline .l2 { font-size:.78rem; color:var(--ink-faint); margin-top:.15rem; }

  .drop { z-index:3; width:max-content; max-width:80%; padding:.8rem 1.1rem; text-align:center; opacity:0;
    background:var(--surface-2); border:1px solid var(--border); border-radius:20px; box-shadow:0 8px 28px rgba(0,0,0,.28);
    touch-action:none; cursor:pointer; -webkit-touch-callout:none; }
  .drop::before { content:""; position:absolute; inset:-16px; }
  .drop.glide { transition:transform .9s cubic-bezier(.3,.7,.3,1), opacity .9s ease; }
  .drop .tag { display:block; font-size:.62rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:.15rem; }
  .drop .txt { font-family:var(--font-display); font-size:1.18rem; line-height:1.3; color:var(--ink); }
  .drop.k-person { border-color:color-mix(in srgb, var(--heart) 45%, var(--border)); }
  .drop.k-thanks { border-color:color-mix(in srgb, var(--gold) 55%, var(--border)); }
  .drop.k-feeling { border-color:color-mix(in srgb, #7FA3E0 45%, var(--border)); }
  .drop.k-fear { border-color:color-mix(in srgb, #E0A07F 50%, var(--border)); }
  .drop.k-concern { border-color:color-mix(in srgb, #B79FE0 40%, var(--border)); }
  .drop.held { cursor:default; box-shadow:0 0 0 2px var(--gold-glow), 0 12px 34px rgba(0,0,0,.35); }
  .drop.held .txt { font-size:1.32rem; }

  .spoken { left:0; right:0; max-width:23rem; margin-inline:auto; text-align:center; padding:0 1rem; pointer-events:none; opacity:0; transition:opacity .7s ease; z-index:4; }
  .spoken.on { opacity:1; }
  .spoken .s1 { font-family:var(--font-display); font-style:italic; font-size:1.25rem; color:var(--gold); text-shadow:0 0 24px var(--gold-glow); }
  .spoken .s2 { font-size:.9rem; color:var(--ink-muted); margin-top:.3rem; text-shadow:0 0 10px var(--bg), 0 0 4px var(--bg); }

  .restnote { left:0; right:0; max-width:19rem; margin-inline:auto; text-align:center; padding:0 1rem; line-height:1.5; color:var(--ink-muted); font-size:.95rem; pointer-events:none; opacity:0; transition:opacity .6s ease; }
  .restnote.on { opacity:1; }

  /* the dock: little buckets, always visible. Drag a caught drop onto one (or tap one while holding). */
  .dock { left:0; right:0; top:auto; bottom:calc(env(safe-area-inset-bottom,0px) * .4); height:110px; z-index:4; pointer-events:none; }
  .bk { position:absolute; left:0; top:0; width:2.75rem; padding:.4rem .05rem .3rem; display:flex; flex-direction:column; align-items:center; gap:.12rem;
    background:var(--surface); border:1px solid var(--border); border-radius:14px; color:var(--ink-muted); pointer-events:auto;
    transform:var(--pos); transition:transform .2s ease, border-color .2s ease, background .2s ease, opacity .6s ease; opacity:.55; }
  .dock.nolayout .bk { transition:none; }
  .st-in .bk { opacity:1; }
  .bk svg { width:1.35rem; height:1.35rem; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .bk .lbl { font-size:.54rem; line-height:1.1; text-align:center; letter-spacing:.01em; }
  .bk.father { color:color-mix(in srgb, var(--gold) 80%, var(--ink-muted)); }
  .bk.spirit { color:#8FB0E8; } .bk.jesus { color:var(--heart); } .bk.bin { color:#B49A8A; }
  .bk.over { transform:var(--pos) scale(1.25); border-color:var(--gold); background:var(--surface-2); }
  .bk.has { border-color:color-mix(in srgb, var(--gold) 60%, var(--border)); }
  .bk .count { position:absolute; top:-.4rem; right:-.25rem; min-width:1.15rem; height:1.15rem; border-radius:999px; padding:0 .25rem;
    background:var(--gold); color:#1a1608; font-size:.68rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .bk.pulse { animation:pulse .9s ease; }
  @keyframes pulse { 40% { transform:var(--pos) scale(1.2); box-shadow:0 0 22px var(--gold-glow); } }
  .installbar { left:0; right:0; width:92%; margin-inline:auto; display:flex; align-items:center; justify-content:space-between; gap:.5rem; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:.45rem .6rem .45rem .8rem; z-index:5; font-size:.8rem; color:var(--ink-muted); }
  .ib-actions { display:flex; gap:.35rem; flex-shrink:0; }
  .steps { padding-left:0; list-style:none; counter-reset:s; max-width:26rem; margin:1rem auto 0; }
  .steps li { counter-increment:s; display:flex; gap:.7rem; align-items:flex-start; margin:.7rem 0; font-size:1rem; }
  .steps li::before { content:counter(s); flex-shrink:0; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--surface-2); border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:.85rem; }
  .steps svg { width:1.15rem; height:1.15rem; vertical-align:-.2rem; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .cue { left:0; right:0; max-width:19rem; margin-inline:auto; text-align:center; font-family:var(--font-display); font-style:italic; color:var(--gold); font-size:.95rem; pointer-events:none; opacity:0; transition:opacity .5s ease; z-index:3; }
  .cue.on { opacity:1; }
  .helpstep { text-align:center; padding-top:4vh; }
  .helpart svg { width:min(15rem,70%); height:auto; }
  .helpstep h3 { font-family:var(--font-display); font-weight:400; font-size:1.5rem; margin:.4rem 0 .6rem; }
  .helpstep p { color:var(--ink-muted); font-size:1.02rem; max-width:24rem; margin:0 auto; }
  .dots { display:flex; justify-content:center; gap:.45rem; margin:1.2rem 0 .4rem; }
  .dots i { width:.5rem; height:.5rem; border-radius:50%; background:var(--border); } .dots i.on { background:var(--gold); }
  .legend { text-align:left; max-width:24rem; margin:1.1rem auto 0; display:grid; gap:.45rem; }
  .legend div { display:flex; align-items:center; gap:.7rem; font-size:.92rem; }
  .legend svg { width:1.6rem; height:1.6rem; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .legend b { display:block; font-weight:600; font-size:.88rem; } .legend span { color:var(--ink-muted); }
  .helpnav { display:flex; justify-content:space-between; gap:.6rem; max-width:24rem; margin:1.2rem auto 0; }
  .holdnote { left:0; right:0; max-width:19rem; margin-inline:auto; text-align:center; font-size:.8rem; color:var(--ink-muted); padding:0 1.5rem; pointer-events:none; opacity:0; transition:opacity .4s ease; }
  .holdnote.on { opacity:1; }
  .partpick { left:5%; right:5%; z-index:6; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:.8rem .8rem .5rem; box-shadow:0 14px 40px rgba(0,0,0,.4); }
  .drop.dragging { transition:none !important; z-index:7; cursor:grabbing; touch-action:none; }

  .bar { flex-shrink:0; display:flex; justify-content:center; align-items:center; gap:.8rem; min-height:2.6rem; padding-top:.35rem; }
  .linkbtn { background:none; border:none; padding:.5rem .9rem; font-size:.88rem; color:var(--ink-muted); border-radius:999px; }
  .linkbtn:hover { color:var(--ink); background:var(--surface); }
  .resume { z-index:5; background:var(--surface-2); border:1px solid var(--gold); color:var(--ink); padding:.55rem 1.4rem; border-radius:999px; font-size:.95rem; }

  /* ---------- offer lines ---------- */
  .sheet-title { font-family:var(--font-display); font-style:italic; text-align:center; color:var(--gold); font-size:1.12rem; margin:.1rem 0 .7rem; }
  .sheet-note { text-align:center; font-size:.82rem; color:var(--ink-muted); margin:0 0 .7rem; }
  .linebtn { display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:.62rem .95rem; margin-bottom:.45rem; min-height:3.2rem; }
  .linebtn:hover, .linebtn:active { border-color:var(--gold); }
  .linebtn .line { display:block; font-family:var(--font-display); font-size:1.05rem; color:var(--ink); }
  .linebtn .sub { display:block; font-size:.72rem; color:var(--ink-faint); margin-top:.05rem; }
  .linebtn.soft { background:transparent; }
  .linebtn.said { border-color:color-mix(in srgb, var(--gold) 60%, var(--border)); }
  .linebtn.said .sub::before { content:"said · "; color:var(--gold); }
  .chips { display:flex; flex-wrap:wrap; gap:.45rem; margin:.2rem 0 .7rem; }
  .chip { background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:.5rem .9rem; font-size:.9rem; color:var(--ink); }
  .chip:hover, .chip.on { border-color:var(--gold); }
  .chip.on { background:color-mix(in srgb, var(--gold) 16%, var(--surface-2)); }
  .chip.quiet { color:var(--ink-muted); background:transparent; }

  /* ---------- overlays ---------- */
  .overlay { position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column;
    padding:calc(.7rem + env(safe-area-inset-top,0px)) .9rem calc(.8rem + env(safe-area-inset-bottom,0px)); opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .ov-head { display:flex; align-items:center; gap:.6rem; flex-shrink:0; height:2.4rem; }
  .ov-head h2 { flex:1; margin:0; font-family:var(--font-display); font-weight:400; font-size:1.15rem; }
  .ov-body { flex:1; min-height:0; overflow-y:auto; padding:.8rem .1rem 1rem; max-width:36rem; width:100%; margin:0 auto; }
  .ov-body.flex { display:flex; flex-direction:column; overflow:hidden; padding:0; }
  .back { width:2.3rem; height:2.3rem; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-size:1.1rem; color:var(--ink-muted); }
  .quiet { color:var(--ink-muted); font-size:.88rem; }
  .sec { margin:1rem 0 .4rem; font-size:.7rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:1.1rem 1.1rem; margin-bottom:.9rem; }
  .card .tag { font-size:.64rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); }
  .card .big { font-family:var(--font-display); font-size:1.4rem; line-height:1.3; margin:.2rem 0 .1rem; }
  .verdict { display:inline-block; font-size:.72rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:.2rem .65rem; margin:.3rem 0 .4rem; border:1px solid var(--border); }
  .verdict.lie { color:#E4A06A; border-color:#E4A06A55; } .verdict.truth { color:#8FC7A0; border-color:#8FC7A055; }
  .qs p { margin:.5rem 0; font-family:var(--font-display); font-style:italic; color:var(--ink); }

  /* lists */
  .tabs { display:flex; gap:.35rem; overflow-x:auto; padding-bottom:.4rem; flex-shrink:0; scrollbar-width:none; }
  .tab { white-space:nowrap; background:transparent; border:1px solid var(--border); border-radius:999px; padding:.4rem .85rem; font-size:.85rem; color:var(--ink-muted); }
  .tab.on { background:var(--surface-2); color:var(--ink); border-color:var(--gold); }
  .addrow { display:flex; gap:.45rem; margin:.7rem 0; }
  .field { flex:1; min-width:0; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:12px; padding:.65rem .8rem; font-size:1rem; }
  .btn { background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:.6rem 1rem; font-size:.92rem; }
  .btn.primary { border-color:var(--gold); }
  .row { display:flex; align-items:center; gap:.5rem; padding:.55rem .1rem; border-bottom:1px solid var(--border); }
  .row .t { flex:1; min-width:0; overflow-wrap:anywhere; }
  .row.paused .t { opacity:.45; text-decoration:line-through; text-decoration-color:var(--ink-faint); }
  .row .t.edit { background:none; border:none; text-align:left; padding:.35rem 0; font-size:1rem; color:var(--ink); font-family:inherit; flex:1; min-width:0; }
  .row .part { display:block; font-size:.78rem; color:var(--ink-muted); }
  .mini { background:none; border:1px solid var(--border); border-radius:8px; padding:.3rem .6rem; font-size:.76rem; color:var(--ink-muted); }
  .mini.warn { border-color:#C96A6A; color:#E49A9A; }

  .seg { display:flex; gap:.4rem; flex-wrap:wrap; }

  /* noticed */
  .nrow .when { font-size:.78rem; color:var(--ink-faint); margin-top:.15rem; }
  .nrow { padding:.7rem 0; border-bottom:1px solid var(--border); }
  .nrow .nt { font-family:var(--font-display); font-size:1.02rem; }
  .nchips { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.35rem; }
  .nchip { font-size:.72rem; border:1px solid var(--border); border-radius:999px; padding:.12rem .55rem; color:var(--ink-muted); }
  .nseq { font-size:.74rem; color:var(--ink-faint); margin-top:.3rem; }

  /* pray */
  .prayhead { display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.2rem .2rem .6rem; flex-shrink:0; }
  .plast { font-size:.8rem; color:var(--ink-muted); margin-top:.1rem; }
  .pname { font-family:var(--font-display); font-size:1.3rem; min-width:0; overflow-wrap:anywhere; }
  .people { display:flex; flex-wrap:wrap; gap:.4rem; padding:.2rem 0 .5rem; flex-shrink:0; }
  .cloudfield { position:relative; flex:1; min-height:0; overflow:hidden; border-radius:20px; touch-action:manipulation;
    background:radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--gold) 8%, var(--surface)) 0%, var(--bg) 78%); }
  .cword { position:absolute; left:0; top:0; background:none; border:none; padding:.45rem .7rem; font-family:var(--font-display); color:var(--ink-muted);
    white-space:nowrap; will-change:transform; transition:opacity 1.6s ease, color .5s ease, text-shadow .5s ease; opacity:0; }
  .cword.in { opacity:1; }
  .cword:hover { color:var(--ink); }
  .cword.claimed { color:var(--gold); text-shadow:0 0 22px var(--gold-glow); }
  .cword .w { display:inline-block; transition:transform .5s cubic-bezier(.2,.7,.3,1); }
  .cword.claimed .w { transform:scale(1.18); }
  .cword.settled { opacity:1; font-size:1rem; }
  .cword.settled .w { transform:none; }
  .praybar { flex-shrink:0; text-align:center; padding:.5rem .1rem calc(.4rem + env(safe-area-inset-bottom,0px)); }
  .praybar .s1 { height:3.1rem; overflow:hidden; line-height:1.35; }
  .amen { display:block; width:100%; margin-top:.35rem; padding:.7rem .9rem; border-radius:16px; background:color-mix(in srgb, var(--gold) 16%, var(--surface-2)); border:1px solid var(--gold);
    color:var(--ink); font-family:var(--font-display); font-size:.98rem; line-height:1.35; }
  .amen.off { visibility:hidden; pointer-events:none; }
  .amen:hover, .amen:active { background:color-mix(in srgb, var(--gold) 28%, var(--surface-2)); }
  .praybar .s1 { font-family:var(--font-display); font-style:italic; color:var(--gold); font-size:1.12rem; }
  .praybar .s2 { font-size:.8rem; color:var(--ink-faint); margin-top:.3rem; }
  .emptynote { text-align:center; color:var(--ink-muted); padding:2.5rem 1.2rem; }

  .topcard { position:fixed; left:0; right:0; top:0; z-index:40; padding:calc(.7rem + env(safe-area-inset-top,0px)) .9rem .8rem;
    background:var(--surface); border-bottom:1px solid var(--border); box-shadow:0 12px 40px rgba(0,0,0,.4); }
  .topcard .inner { max-width:34rem; margin:0 auto; }
  .topcard label { display:block; font-size:.8rem; color:var(--ink-muted); margin-bottom:.4rem; }
  .scrim { position:fixed; inset:0; z-index:39; background:rgba(0,0,0,.45); }

  /* Landscape on a phone: the app is portrait only. */
  .updatebar { position:fixed; left:.6rem; right:.6rem; top:calc(.5rem + env(safe-area-inset-top,0px)); z-index:150; max-width:34rem; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.55rem .7rem .55rem .9rem; border-radius:14px;
    background:var(--surface-2); border:1px solid var(--gold); box-shadow:0 10px 30px rgba(0,0,0,.35); font-size:.92rem; }
  .ub-actions { display:flex; align-items:center; gap:.4rem; flex-shrink:0; }
  .rotate { display:none; position:fixed; inset:0; z-index:200; background:var(--bg); color:var(--ink); flex-direction:column; align-items:center; justify-content:center; gap:.9rem; text-align:center; padding:1.5rem; }
  .rotate svg { width:3.2rem; height:3.2rem; fill:none; stroke:var(--gold); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .rotate p { margin:0; font-family:var(--font-display); font-size:1.15rem; max-width:20rem; }
  .rotate small { color:var(--ink-muted); font-size:.85rem; }
  @media (orientation: landscape) and (max-height: 600px) and (pointer: coarse) { .rotate { display:flex; } }

  @media (prefers-reduced-motion: reduce) {
    .heart.apart, .st-with .christ .halo, .st-with .heart svg { animation:none; }
    .cloud, .cloud .puff { transition:none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="wordmark">Treasuring</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-pause" aria-label="Pause" hidden><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
      <button class="icon-btn" id="btn-help" aria-label="How it works"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.2 1-1.2 1.9M12 17h.01"/></svg></button>
      <button class="icon-btn" id="btn-lists" aria-label="Lists"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M10.3 2.8h3.4l.5 2.4 1.9.8 2.1-1.4 2.4 2.4-1.4 2.1.8 1.9 2.4.5v3.4l-2.4.5-.8 1.9 1.4 2.1-2.4 2.4-2.1-1.4-1.9.8-.5 2.4h-3.4l-.5-2.4-1.9-.8-2.1 1.4-2.4-2.4 1.4-2.1-.8-1.9-2.4-.5v-3.4l2.4-.5.8-1.9-1.4-2.1 2.4-2.4 2.1 1.4 1.9-.8z"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="cloud" id="cloud" aria-hidden="true">
      <svg viewBox="0 0 340 96">
        <ellipse class="glow" cx="170" cy="76" rx="120" ry="26"/>
        <circle class="puff" cx="82" cy="58" r="30"/><circle class="puff" cx="128" cy="40" r="38"/>
        <circle class="puff" cx="184" cy="36" r="40"/><circle class="puff" cx="236" cy="54" r="32"/>
        <rect class="puff" x="70" y="56" width="180" height="30" rx="15"/>
      </svg>
    </div>

    <div class="christ" id="christ" aria-hidden="true">
      <div class="halo"></div><div class="disc"></div>
      <svg viewBox="0 0 100 100"><path class="cross" d="M50 24v52M32 42h36"/></svg>
      <div class="name">Jesus</div>
    </div>

    <div class="heartline" id="heartline"><div class="l1">Jesus, I place my heart with you.</div><div class="l2">drag your heart to Him</div></div>
    <button class="heart apart" id="heart" aria-label="Your heart. Press to place it with Jesus.">
      <svg viewBox="0 0 64 64"><path class="shape" d="M32 56C10 40 6 28 6 20a13 13 0 0 1 26-3 13 13 0 0 1 26 3c0 8-4 20-26 36z"/></svg>
    </button>

    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Catch this"><span class="tag"></span><span class="txt"></span></div>
    <div class="spoken" id="spoken" aria-live="polite"><div class="s1"></div><div class="s2"></div></div>
    <div class="restnote" id="restnote"></div>

    <button class="resume" id="btn-continue" hidden>Continue</button>
    <div class="installbar" id="installbar" hidden><span>Keep Treasuring on your Home Screen.</span><span class="ib-actions"><button class="mini" id="ib-show">Show me</button><button class="mini" id="ib-no" aria-label="Not now">✕</button></span></div>
    <div class="cue" id="cue"></div>
    <div class="holdnote" id="holdnote"></div>
    <div class="partpick" id="partpick" hidden></div>
    <div class="dock" id="dock">
      <button class="bk father" data-b="hands" aria-label="Father, into your hands: release it"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5M14 10.5V5.5a1.5 1.5 0 0 1 3 0V14M17 9.5a1.5 1.5 0 0 1 3 0V15c0 4-3 7-7 7-3 0-4.5-1.5-6-4l-3-4.5a1.5 1.5 0 0 1 2.5-1.5L8 14"/></svg><span class="lbl">Release</span></button>
      <button class="bk father" data-b="part" aria-label="Father, what is my part today"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/></svg><span class="lbl">My part</span></button>
      <button class="bk father" data-b="thanks" aria-label="Father, thank you: the treasure chest"><svg viewBox="0 0 24 24"><path d="M3 11.5V9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2.5z" fill="currentColor" fill-opacity=".22"/><rect x="3" y="11.5" width="18" height="8.5" rx="1.5" fill="currentColor" fill-opacity=".1"/><path d="M7.5 5.5v14.5M16.5 5.5v14.5M3 11.5h18"/><rect x="10.2" y="10" width="3.6" height="4.400" rx="1" fill="currentColor"/><path d="M21 2.5v3M19.5 4h3"/></svg><span class="lbl">Thanks</span></button>
      <button class="bk spirit" id="b-spirit" data-b="spirit" aria-label="Holy Spirit, help me understand: insight"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.800 11.8c.8.600 1.300 1.5 1.300 2.2h5c0-.7.5-1.600 1.300-2.2A6.5 6.5 0 0 0 12 2.5z"/></svg><span class="lbl">Insight</span><span class="count" id="spirit-count" hidden></span></button>
      <button class="bk jesus" data-b="hold" aria-label="Jesus, I hold this to you"><svg viewBox="0 0 24 24"><path d="M12 3v18M6 9h12"/></svg><span class="lbl">Hold</span></button>
      <button class="bk father" id="b-pray" data-b="pray" aria-label="Intercede for people"><svg viewBox="0 0 24 24"><path d="M12 2c1.8 2.2 2.8 3.6 2.8 5a2.8 2.8 0 0 1-5.6 0C9.2 5.6 10.2 4.2 12 2z" fill="currentColor" fill-opacity=".3"/><rect x="8.5" y="11" width="7" height="10" rx="1.2"/><path d="M12 9.5v1.5"/></svg><span class="lbl">Intercede</span></button>
      <button class="bk bin jesus" data-b="lie" aria-label="Jesus, I put this lie down"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span class="lbl">Lies</span></button>
    </div>
  </main>

</div>

<div id="overlays"></div>
<div class="updatebar" id="updatebar" hidden role="status"><span>A new version is ready.</span><span class="ub-actions"><button class="btn primary" id="ub-go">Refresh</button><button class="mini" id="ub-later">Later</button></span></div>
<div id="topcard-host"></div>
<div class="rotate" id="rotate" role="alert"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><p>Please turn your phone upright.</p><small>Treasuring is made to be held this way. Your heart stays with Him.</small></div>

<script src="content.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
