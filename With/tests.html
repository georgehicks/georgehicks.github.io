<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>With — acceptance tests</title>
<style>
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 20px; max-width: 900px; }
  .pass { color: #1d7a3e; } .fail { color: #b3261e; font-weight: 600; }
  #sum { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  li { margin: 2px 0; } code { font-size: 12px; }
</style>
</head>
<body>
<div id="sum">Running…</div>
<ul id="out"></ul>
<script type="module">
// Dev-only page (not cached by sw.js, not linked from the app). Covers the pure logic in engine.js,
// the shape of content.json, and a few source-level rules from DESIGN.md.
import * as E from './engine.js';
const C = E.deepFreeze(await (await fetch('content.json?_=' + Date.now())).json());
const src = await Promise.all(['app.js', 'engine.js', 'sw.js'].map(f => fetch(f + '?_=' + Date.now()).then(r => r.text())));
const versesJson = await fetch('verses.json?_=' + Date.now()).then(r => r.json());
const design = await fetch('DESIGN.md?_=' + Date.now()).then(r => r.ok ? r.text() : null).catch(() => null);
const out = document.getElementById('out');
let pass = 0, fail = 0;
function t(name, fn) {
  let ok = false, msg = '';
  try { const r = fn(); ok = r === true || r === undefined; if (r !== true && r !== undefined) msg = String(r); }
  catch (e) { msg = e.message; }
  ok ? pass++ : fail++;
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' — ' + msg : '');
  out.append(li);
}
const eq = (a, b, what = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${what} expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); };
const S = { ...E.DEFAULT_SETTINGS };
const done = (path = 'quick', extra = {}) => { const s = E.newSession(path); E.startSession(C, s); s.status = 'complete'; return Object.assign(s, extra); };

// ---- guidance fade ----
t('Fade: coaching shows for the first 3 completed sessions, then collapses', () => {
  eq([0, 1, 2, 3, 9].map(n => E.guidanceOn('fade', n)), [true, true, true, false, false]);
});
t('Always shows and Hide hides, whatever the count', () => eq([E.guidanceOn('always', 99), E.guidanceOn('hide', 0)], [true, false]));
t('only completed sessions count toward the fade', () => eq(E.completedCount([{ status: 'complete' }, { status: 'open' }, { status: 'resting' }, { status: 'complete' }]), 2));
t('Not sure? and Nothing came? are not governed by the guidance rule', () => !/guid/i.test(src[0].match(/openNotSure\(def\.notSure\), text: R\.notSure/)?.[0] || '') && src[0].includes("text: R.nothingCame"));

// ---- step runner: Quick ----
t('Quick flow: bring, know, do, more, keep (no forced test step)', () => eq(E.flowOf(C, 'quick'), ['bring', 'know', 'do', 'more', 'keep']));
t('runner walks Quick in order and finishes with null', () => {
  const s = E.startSession(C, E.newSession('quick'));
  const seen = [s.at];
  let to; while ((to = E.advance(C, s, 'no')) != null) seen.push(to);
  eq(seen, ['bring', 'know', 'do', 'more', 'keep']);
});
t('"Is there more?" yes goes to Ask Him anything and back to the question; no goes to Keep', () => {
  const s = E.startSession(C, E.newSession('quick'), 'more');
  eq(E.advance(C, s, 'yes'), 'followup'); eq(s.followUps.length, 1);
  eq(E.advance(C, s), 'more'); eq(E.advance(C, s, 'yes'), 'followup'); eq(s.followUps.length, 2);
  eq(E.advance(C, s), 'more'); eq(E.advance(C, s, 'no'), 'keep');
});
t('step counter counts only the path steps, not Ask Him anything', () => {
  const s = E.startSession(C, E.newSession('quick'), 'do'); eq(E.stepCounter(C, s), { n: 3, total: 5 });
  E.jump(s, 'followup'); eq(E.stepCounter(C, s), null);
});
t('Back follows the way the person came, and stops at the first step', () => {
  const s = E.startSession(C, E.newSession('quick')); E.advance(C, s); E.advance(C, s);
  eq(E.back(s), 'know'); eq(E.back(s), 'bring'); eq(E.back(s), null);
});

// ---- Deeper ----
t('Deeper flow: glad memory, appreciation, welcome, bring, ask, keep', () => eq(E.flowOf(C, 'deeper').filter(k => k !== 'know' && k !== 'do' && k !== 'more'), ['glad', 'appreciate', 'welcome', 'bring', 'keep']));
t('Back to the glad place returns to appreciation, and Back returns from it', () => {
  const s = E.startSession(C, E.newSession('deeper'), 'welcome'); E.jump(s, C.paths.deeper.gladPlaceKey);
  eq(s.at, 'appreciate'); eq(E.back(s), 'welcome');
});
t('Deeper: Back to the glad place is not offered on step 1 (source rule)', () => src[0].includes("idx > 0 && key !== P.gladPlaceKey"));

// ---- Healing ----
t('Healing flow runs ready check through keep', () => eq(E.flowOf(C, 'healing'), ['ready', 'ask', 'see', 'jesus', 'gave', 'forgave', 'lietruth', 'feel', 'again', 'keep']));
t('feel: peace goes to Keep; lighter or heavy goes to Ask again', () => {
  const a = E.startSession(C, E.newSession('healing'), 'feel'); eq(E.advance(C, a, 'peace'), 'keep');
  const b = E.startSession(C, E.newSession('healing'), 'feel'); eq(E.advance(C, b, 'heavy'), 'again');
});
t('Ask again loops to step 4, 5, 7 or step 2, each as a fresh pass, with no limit', () => {
  const s = E.startSession(C, E.newSession('healing'), 'again');
  for (let i = 0; i < 6; i++) { eq(E.advance(C, s, ['jesus', 'gave', 'lietruth', 'ask', 'jesus', 'gave'][i]), ['jesus', 'gave', 'lietruth', 'ask', 'jesus', 'gave'][i]); s.at = 'again'; }
  eq(s.round, 6);
});
t('"I\'m done for today" ends the pass without a score', () => { const s = E.startSession(C, E.newSession('healing'), 'again'); return E.advance(C, s, 'rest') === null; });
t('resting a Healing session and reopening starts at the ready check, then returns to where they stopped', () => {
  const s = E.startSession(C, E.newSession('healing'), 'gave');
  E.rest(s); eq(s.status, 'resting'); eq(s.resumeAt, 'gave');
  E.resumeSession(C, s); eq(s.at, 'ready'); eq(s.status, 'open');
  eq(E.advance(C, s), 'gave'); eq(s.resumeAt, null);
});
t('answers from each pass are kept; memory mirrors the latest pass and rounds log each feel', () => {
  const s = E.startSession(C, E.newSession('healing'), 'jesus');
  E.setAnswer(s, 'jesus', 'p', 'first'); s.round = 1; E.setAnswer(s, 'jesus', 'p', 'second');
  E.pushRound(s, 'lighter', 'a bit', new Date(2026, 0, 1)); E.pushRound(s, 'peace', '', new Date(2026, 0, 2));
  E.syncMemory(s); eq(s.steps.length, 2); eq(s.memory.jesus, 'second'); eq(s.memory.feel, 'peace'); eq(s.memory.rounds.length, 2);
});
t('lies and truth are both recorded', () => {
  const s = E.startSession(C, E.newSession('healing'), 'lietruth');
  const e = E.ensureEntry(s, 'lietruth', 'x'); e.lie = 'I am alone'; e.answer = 'You are with me'; E.syncMemory(s);
  eq([s.memory.lie, s.memory.truth], ['I am alone', 'You are with me']);
});
t('the Healing session has a memory block; other paths do not', () => E.newSession('healing').memory !== null && E.newSession('quick').memory === null);
t('Stop and rest is on every Healing step (source) and no review-status note shows on screen', () => src[0].includes("s.path === 'healing' ? link(R.stopRest, restSession") && !src[0].includes("class: 'pending'"));

// ---- Daily and Journaling ----
t('Daily: moment, one prompt, keep (optional)', () => eq(E.flowOf(C, 'daily'), ['moment', 'dailyask', 'keep']));
t('Daily moments are Morning, A decision, After Scripture, Praying for someone, Evening, Other', () =>
  eq(C.paths.daily.defs.moment.options.map(o => o.label), ['Morning', 'A decision', 'After Scripture', 'Praying for someone', 'Evening', 'Other']));
t('Daily "A decision" asks for wisdom and the next faithful step, not a yes or no', () =>
  eq(C.paths.daily.defs.moment.options[1].prompt, 'What do You want me to know about this? What is the next faithful step?'));
t('Daily records are shown lighter in Review; others are not', () => E.isLight({ path: 'daily' }) && !E.isLight({ path: 'quick' }));
t('Journaling has seven steps, then Keep', () => eq(E.flowOf(C, 'journaling').length - 1, 7));

// ---- drafts: autosave and resume ----
t('a new session with nothing written is not worth keeping', () => !E.isMeaningful(E.newSession('quick')));
t('a typed answer, a Keep line, a test answer or a chosen moment make a session worth keeping', () => {
  const a = E.newSession('quick'); E.setAnswer(a, 'bring', 'p', 'x');
  const b = E.newSession('quick'); b.keep = 'k';
  const c = E.newSession('quick'); E.setTest(c, 'scripture', 'yes');
  const d = E.newSession('daily'); d.moment = { id: 'morning' };
  return [a, b, c, d].every(E.isMeaningful);
});
t('a draft survives a JSON round trip (lock-screen or app kill) and resumes at the same step', () => {
  const s = E.startSession(C, E.newSession('quick')); E.setAnswer(s, 'bring', 'p', 'my worry'); E.advance(C, s);
  const back = JSON.parse(JSON.stringify(s)); E.resumeSession(C, back);
  eq([back.at, back.trail, E.entryFor(back, 'bring').answer], ['know', ['bring'], 'my worry']);
});
t('bringing is the Bring answer; titleOf falls back to the first answer, the Daily moment, then the path', () => {
  const s = E.newSession('quick'); E.setAnswer(s, 'bring', 'p', 'my worry'); eq(E.titleOf(C, s), 'my worry');
  const d = E.newSession('daily'); d.moment = { label: 'Evening' }; eq(E.titleOf(C, d), 'Evening');
  eq(E.titleOf(C, E.newSession('quick')), 'Quick');
});
t('upsert replaces a session by id and appends a new one', () => {
  const a = E.newSession('quick'), b = E.newSession('quick'); let l = E.upsertSession([], a); l = E.upsertSession(l, b);
  a.keep = 'k'; l = E.upsertSession(l, a); eq(l.length, 2); eq(l[0].keep, 'k');
});
t('Nothing yet is a normal answer: markNothing records it with an empty box and the session can finish', () => {
  const s = E.startSession(C, E.newSession('quick'), 'know'); const e = E.markNothing(s, 'know', 'p'); eq(e.how, ['nothing']);
  E.complete(s); eq(s.status, 'complete'); eq(E.exportText(C, [s]).includes('Nothing yet'), true);
});
t('How did it come: real ways combine; Not sure and Nothing yet stand alone', () => {
  const e = { how: [] }; E.toggleHow(e, 'thought'); E.toggleHow(e, 'scripture'); eq(e.how, ['thought', 'scripture']);
  E.toggleHow(e, 'unsure'); eq(e.how, ['unsure']); E.toggleHow(e, 'peace'); eq(e.how, ['peace']); E.toggleHow(e, 'nothing'); eq(e.how, ['nothing']);
});

// ---- test step ----
t('Test has four questions in the design order, with yes / not sure / no', () => {
  eq(C.test.questions.map(q => q.name), ['Scripture', 'Jesus', 'Love', 'Someone I trust']);
  eq(C.test.options.map(o => o.label), ['Yes', 'Not sure', 'No']);
  eq(C.test.top, 'Looking at it:');
});
t('"no" on Scripture or Jesus: set it down and talk with someone', () => eq([E.testAdvice({ scripture: 'no' }), E.testAdvice({ jesus: 'no', love: 'yes' })], ['no', 'no']));
t('"not sure" anywhere, or "no" on love or on telling someone: hold it lightly', () => {
  eq(E.testAdvice({ scripture: 'unsure' }), 'unsure'); eq(E.testAdvice({ love: 'unsure' }), 'unsure');
  eq(E.testAdvice({ love: 'no' }), 'unsure'); eq(E.testAdvice({ trusted: 'no' }), 'unsure');
});
t('all yes, or nothing answered, gives no advice', () => eq([E.testAdvice({ scripture: 'yes', jesus: 'yes', love: 'yes', trusted: 'yes' }), E.testAdvice({})], [null, null]));
t('a "no" wins over a "not sure"', () => eq(E.testAdvice({ scripture: 'unsure', jesus: 'no' }), 'no'));
t('tapping the same answer twice clears it', () => { const s = E.newSession('quick'); E.setTest(s, 'love', 'yes'); E.setTest(s, 'love', 'yes'); return s.test.love === null; });
t('repeated "not sure" across three sessions triggers the rest line; two do not', () => {
  const U = (d) => done('quick', { started: d, test: { scripture: 'unsure', jesus: null, love: null, trusted: null, note: '' } });
  const a = U('2026-01-01T10:00:00+00:00'), b = U('2026-01-02T10:00:00+00:00'), c = U('2026-01-03T10:00:00+00:00');
  eq(E.repeatedUnsure([a, b], c), true); eq(E.repeatedUnsure([a], c), false);
  const yes = done('quick', { started: '2026-01-02T10:00:00+00:00', test: { scripture: 'yes', jesus: 'yes', love: 'yes', trusted: 'yes', note: '' } });
  eq(E.repeatedUnsure([a, yes], c), false);
});
t('the Test copy never says a feeling proves who something is from', () => !/proves?|this means it is|is from God because|you can be sure/i.test(JSON.stringify(C.test) + JSON.stringify(C.standing)));
t('Test and the standing check use the same four ideas', () => C.standing.lines.length === 4 && /Scripture/.test(C.standing.lines[0]) && /Jesus/.test(C.standing.lines[1]) && /love/.test(C.standing.lines[2]) && /someone I trust/.test(C.standing.lines[3]));

// ---- safety ----
t('worrisome text is caught, with curly apostrophes, and ordinary text is not', () => {
  const k = C.safety.keywords;
  return E.isWorrisomeText('I want to die', k) && E.isWorrisomeText('I don’t want to live', k) && E.isWorrisomeText('voices telling me to', k)
    && !E.isWorrisomeText('I am worried about my job and my sister', k) && !E.isWorrisomeText('', k);
});
t('worrisomeText finds worry in an answer, a lie, the keep line, a note or a follow-up', () => {
  const k = C.safety.keywords, s = E.newSession('quick');
  eq(E.worrisomeText(s, k), ''); s.test.note = 'I want to die'; eq(E.sessionWorrisome(s, k), true);
  const t2 = E.newSession('healing'); E.ensureEntry(t2, 'lietruth', 'x').lie = 'I should end it all'; eq(E.sessionWorrisome(t2, k), true);
});
t('988 appears in the app only via the safety line (care block, the stop screen, the Safety page)', () => {
  const j = JSON.stringify({ ...C, safety: 0, safetyPage: 0 });
  return !/988/.test(j) || 'found 988 outside safety content';
});
t('no card, step or care section mentions 988 or crisis language', () => !/988|suicide|crisis/i.test(JSON.stringify([C.objections, C.common, C.paths, C.steps, C.test])));
t('the 988 line is shown only through careBlock and the Safety page', () => (src[0].match(/withTel\(/g) || []).length === 3);

// ---- gating ----
t('Healing and Journaling are gated in content.json; Quick, Deeper and Daily are not', () =>
  eq(E.gatedPaths(C), ['healing', 'journaling']));
t('gated paths are hidden by default and shown only when the hidden switch is on', () => {
  eq(E.visiblePaths(C, S), ['quick', 'deeper', 'daily']);
  eq(E.visiblePaths(C, { ...S, showGated: true }), ['quick', 'deeper', 'healing', 'daily', 'journaling']);
  eq(E.pathVisible(C, 'healing', S), false);
});
t('the switch is off by default', () => eq(E.DEFAULT_SETTINGS.showGated, false));
t('no review-status wording is shown on screen (draft, pending, awaiting review)', () => !/waiting for review|awaiting review|draft, waiting/i.test(JSON.stringify(C.copy)) && !C.meta.draftNote && !C.copy.settings.pendingNote);

// ---- What's in the way? ----
t('exactly six What\'s in the way? cards, all draft, all offered by the sheet', () => {
  eq(C.objections.cards.length, 6); return C.objections.cards.every(c => c.status === 'draft' && c.sheet === true);
});
t('Common questions: four cards, draft, never offered by the sheet', () => {
  eq(C.common.cards.map(c => c.id), ['new_age', 'jesus_in_room', 'arrogant', 'hebrews_cease']);
  return C.common.cards.every(c => c.status === 'draft' && c.sheet === false);
});
t('every Not sure? chip points at one of the six, and the sheet never returns anything else', () => {
  const ids = new Set(C.objections.cards.map(c => c.id));
  const all = [...Object.values(C.steps), ...Object.values(C.paths).flatMap(p => Object.values(p.defs || {}))];
  const bad = all.filter(d => !ids.has(d.notSure)); if (bad.length) return 'bad notSure: ' + bad.map(b => b.notSure);
  eq(E.sheetCard(C, 'new_age').id, 'how_know'); eq(E.sheetCard(C, 'nonsense').id, 'how_know'); eq(E.sheetCard(C, 'tried_nothing').id, 'tried_nothing');
});
t('no practice step lacks a Not sure? target', () => {
  const all = [...Object.entries(C.steps), ...Object.values(C.paths).flatMap(p => Object.entries(p.defs || {}))];
  const bad = all.filter(([, d]) => !d.notSure); return !bad.length || 'missing: ' + bad.map(b => b[0]);
});
t('safety is spoken in God\'s terms: no clinical or policy phrasing anywhere in the content', () => !/prayer form|trained person|trauma work|medical care|counseling or medical|doctor.s care/i.test(JSON.stringify(C)));
t('See how He speaks from a step returns to exactly that step: the helper exists, Back says so, scroll is restored, and only one such link shows at a time', () =>
  src[0].includes('function goFromStep') && (src[0].match(/goFromStep\(/g) || []).length >= 5 && src[0].includes('C.copy.backToStep') && src[0].includes('restoreScroll')
  && src[0].includes('seeExpect.hidden = !!has') && C.copy.backToStep === 'Back to your prayer');
t('the "do" question has its own sentence starters that fit doing, not the "know" ones', () => C.steps.do.starters.length === 3 && C.steps.do.starters.every(x => /want me to|next step|drawn to do/.test(x)) && !C.steps.know.starters && src[0].includes('def.starters || C.starters'));
t('the note and the How did it come? row show once per session, on the first answered step, and not again under a later question', () => src[0].includes('s.howKey = key') && src[0].includes('s.howKey === key'));
t('outlines list every step of a path together, in order, with prompts and starters, for leading a group', () => {
  const d = E.outlineFor(C, 'deeper'), q = E.outlineFor(C, 'quick'), y = E.outlineFor(C, 'daily');
  eq(d.map(x => x.key), C.paths.deeper.flow); eq(q.map(x => x.key), C.paths.quick.flow); eq(y.map(x => x.key), C.paths.daily.flow);
  const doStep = q.find(x => x.key === 'do');
  return d.every(x => x.title) && y.find(x => x.key === 'moment').items.length >= 5 && /want me to/.test(doStep.starters[0]) && doStep.pause === 'Reach, then listen.' && !q.find(x => x.key === 'test') && /optional/.test(q.find(x => x.key === 'keep').items.join(' '));
});
t('the start screen has a quiet Outline link for Quick and for each visible path, and an outline route exists', () => src[0].includes("go('outline/quick')") && src[0].includes("go('outline/' + id)") && src[0].includes('VIEWS.outline') && E.RESTING.includes('outline') && C.copy.outline.link === 'Outline');
t('testing is optional: no path has a test step, Keep carries a folded optional look, and nothing requires it', () =>
  Object.values(C.paths).every(p => !p.flow.includes('test')) && !('test' in C.steps) && src[0].includes('function optionalLook') && src[0].includes("h('details', { class: 'optional-look'") && !/You reached\. Now test/.test(JSON.stringify(C.copy)));
t('Continue where you left off offers only the newest session, and only while it is unfinished', () => {
  const a = { id: 'a', started: '2026-01-01T10:00:00Z', status: 'open', steps: [{ answer: 'x' }] }, b = { id: 'b', started: '2026-01-02T10:00:00Z', status: 'complete' };
  eq(E.resumableOf([a], null).id, 'a');
  eq(E.resumableOf([a, b], null), null);
  return E.resumableOf([b, a], null) === null;
});
t('there is no Care page: no route, no More tile, no links to it, and no top-level care content', () => !('care' in C) && !/VIEWS\.care|go\('care'\)|careLink|careAvailable/.test(src[0] + src[1]) && !JSON.stringify(C.objections.close).includes('heavy'));
t('the name line sits permanently on the start screen, there is no first-launch card, and the care disclaimer lives once in About and Safety', () =>
  C.copy.start.nameLine === 'God with us (Immanuel, Matthew 1:23).' && !C.firstLaunch && !C.objections.footLine
  && C.about.paras.some(x => /doesn't take the place of church, or of the people God has put around you/.test(x))
  && C.safetyPage.paras.some(x => /doesn't take the place of church, or of the people God has put around you/.test(x)));
t('no card uses "usually" or "always" and none uses a persistence test', () => !/\busually\b|\balways\b|fades?\b|over days/i.test(JSON.stringify([C.objections.cards.map(c => c.a), C.common.cards.map(c => c.a)]).replace('I am with you always,', '')));
t('Keep notes and the picturing note are present', () => C.keep.notes.length === 2 && /attempt to listen/.test(C.keep.notes[0]) && /never have to picture/.test(C.remember));
t('the "remember" note sits on the steps that ask the person to remember', () => ['glad', 'appreciate', 'welcome'].every(k => C.paths.deeper.defs[k].remember));

// ---- Scripture and quotes ----
t('every What\'s in the way? card and the Case use references the popover can find', () => {
  const refs = [...C.objections.cards, ...C.common.cards].flatMap(c => E.findRefs(c.refs).filter(x => x.t === 'ref'));
  return refs.length > 15 || 'too few references found: ' + refs.length;
});
t('findRefs: single, range, list and chapter-only references', () => {
  eq(E.findRefs('See John 10:27, John 14:26 and 1 John 4:1–3.').filter(x => x.t === 'ref').map(x => x.v), ['John 10:27', 'John 14:26', '1 John 4:1–3']);
  eq(E.findRefs('(Acts 8:26, 29) and Luke 24:25–27, 32, 45').filter(x => x.t === 'ref').map(x => x.v), ['Acts 8:26, 29', 'Luke 24:25–27, 32, 45']);
  eq(E.findRefs('Samuel in 1 Samuel 3 heard').filter(x => x.t === 'ref').map(x => x.v), ['1 Samuel 3']);
  eq(E.findRefs('Psalm 13:1–2, Psalm 62:8.').filter(x => x.t === 'ref').map(x => x.v), ['Psalm 13:1–2', 'Psalm 62:8']);
});
t('every scripture reference in the content has passage text in verses.json (nothing links out)', () => { const missing = []; const walk = o => { if (typeof o === 'string') E.parseRich(o).forEach(n => { if (!['text', 'em', 'b'].includes(n.t) && !versesJson[n.v]) missing.push(n.v); }); else if (Array.isArray(o)) o.forEach(walk); else if (o && typeof o === 'object') Object.values(o).forEach(walk); }; walk(C); return missing.length === 0 || 'missing: ' + [...new Set(missing)].join('; '); });
t('smart quotes are display only: straight in, curly out, and apostrophes close', () => eq(E.smart(`"It's 'Abba!' he said"`), '“It’s ‘Abba!’ he said”'));
t('parseRich handles em, bold and references together', () => eq(E.parseRich('A *b* **c** John 3:16').map(x => x.t), ['text', 'em', 'text', 'b', 'text', 'ref']));
t('verses.json is shipped (Berean Standard Bible, public domain), includes Matthew 1:23, and is cached for offline', () => {
  const v = versesJson;
  return C.meta.versesFile === true && v['Matthew 1:23'] && /God with us/.test(v['Matthew 1:23'][0][1]) && /verses\.json/.test(src[2]) && C.copy.passage.notice === 'Berean Standard Bible, public domain.';
});
t('Connected rotates among the five design verses and the Murray caption is present', () => {

// ---- every copy key the code reads exists ----
t('every C.copy.* string the app reads exists in content.json', () => {
  const missing = new Set();
  const get = path => path.split('.').reduce((o, k) => o == null ? o : o[k], C);
  for (const s of src.slice(0, 2)) {
    for (const m of s.matchAll(/C\.copy\.([a-zA-Z]+(?:\.[a-zA-Z]+)?)/g)) if (get('copy.' + m[1]) === undefined) missing.add(m[1]);
    // short aliases inside app.js (R = run or review, D = done, M = more, S = start or settings)
    const secs = { R: ['run', 'review'], D: ['done'], M: ['more'], S: ['start', 'settings'] };
    for (const [a, list] of Object.entries(secs))
      for (const m of s.matchAll(new RegExp('\\b' + a + '\\.(\\w+)', 'g')))
        if (list.every(sc => get('copy.' + sc + '.' + m[1]) === undefined) && !['length', 'map', 'filter', 'lines', 'title', 'steps'].includes(m[1])) missing.add(a + '.' + m[1]);
  }
  return !missing.size || 'missing: ' + [...missing].join(', ');
});
